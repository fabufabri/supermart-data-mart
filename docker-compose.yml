services:
  postgres:
    image: postgres:16
    container_name: supermart_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: supermart
      POSTGRES_USER: supermart
      POSTGRES_PASSWORD: supermart123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: